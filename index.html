    async function initRealtimeSync() {
      try {
        let activeFirebaseConfig = null;

        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
          activeFirebaseConfig = JSON.parse(__firebase_config);
        } else if (GITHUB_FIREBASE_CONFIG && GITHUB_FIREBASE_CONFIG.apiKey && GITHUB_FIREBASE_CONFIG.projectId) {
          activeFirebaseConfig = GITHUB_FIREBASE_CONFIG;
        }

        if (!activeFirebaseConfig) {
          updateSyncIndicator(false, 'Mode local');
          return;
        }

        const app = initializeApp(activeFirebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        // Authentification préalable obligatoire avant toute requête
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        authUser = auth.currentUser;
        if (!authUser) {
          updateSyncIndicator(false, 'Mode local');
          return;
        }

        await seedInitialDataIfEmpty();

        // Écouteurs temps réel sur chaque collection partagée (sans requête composée)
        onSnapshot(
          getPublicCollectionRef('users'),
          (snap) => {
            if (!snap.empty) {
              state.users = snap.docs.map(d => d.data());
              if (!state.users.some(u => u.id === state.currentUserId) && state.users.length > 0) {
                state.currentUserId = state.users[0].id;
              }
              renderApp();
            }
          },
          (err) => console.error('Erreur écoute users:', err)
        );

        onSnapshot(
          getPublicCollectionRef('violinSlots'),
          (snap) => {
            state.violinSlots = snap.docs.map(d => d.data());
            renderApp();
          },
          (err) => console.error('Erreur écoute violinSlots:', err)
        );

        onSnapshot(
          getPublicCollectionRef('pianoSlots'),
          (snap) => {
            state.pianoSlots = snap.docs.map(d => d.data());
            renderApp();
          },
          (err) => console.error('Erreur écoute pianoSlots:', err)
        );

        onSnapshot(
          getPublicCollectionRef('auditions'),
          (snap) => {
            state.auditions = snap.docs.map(d => d.data());
            renderApp();
          },
          (err) => console.error('Erreur écoute auditions:', err)
        );

        onSnapshot(
          getPublicCollectionRef('swaps'),
          (snap) => {
            state.swaps = snap.docs
              .map(d => d.data())
              .sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
            renderApp();
          },
          (err) => console.error('Erreur écoute swaps:', err)
        );

        onSnapshot(
          getPublicCollectionRef('notifications'),
          (snap) => {
            state.notifications = snap.docs
              .map(d => d.data())
              .sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
            renderApp();
          },
          (err) => console.error('Erreur écoute notifications:', err)
        );

        updateSyncIndicator(true, 'En direct');
      } catch (err) {
        console.warn('Synchronisation indisponible, bascule en mode local:', err);
        updateSyncIndicator(false, 'Mode local');
      }
    }

    function getCurrentUser() {

    function uid(prefix = 'id') {
      return `${prefix}_${Math.random().toString(36).slice(2, 9)}`;
    }

    function timeToMinutes(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    function minutesToTime(totalMinutes) {
      const clamped = ((totalMinutes % 1440) + 1440) % 1440;
      const h = Math.floor(clamped / 60);
      const m = clamped % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function addMinutesToTime(timeStr, minutesToAdd) {
      return minutesToTime(timeToMinutes(timeStr) + Number(minutesToAdd));
    }

    function formatDuration(mins) {
      const m = Number(mins);
      if (m < 60) return `${m} min`;
      const h = Math.floor(m / 60);
      const rem = m % 60;
      return rem === 0 ? `${h}h00` : `${h}h${String(rem).padStart(2, '0')}`;
    }

    function formatDateFr(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      const formatted = dateObj.toLocaleDateString('fr-FR', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
      return formatted.charAt(0).toUpperCase() + formatted.slice(1);
    }

    function formatShortDateFr(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      const formatted = dateObj.toLocaleDateString('fr-FR', {
        weekday: 'short',
        day: 'numeric',
        month: 'short'
      });
      return formatted.charAt(0).toUpperCase() + formatted.slice(1);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function sortSlots(slots) {
      return [...slots].sort((a, b) => {
        if (a.date !== b.date) return a.date.localeCompare(b.date);
        return timeToMinutes(a.startTime) - timeToMinutes(b.startTime);
      });
    }

    function renderScheduleView(category) {
      const isViolin = category === 'violin';
      const user = getCurrentUser();
      const rawSlots = isViolin ? state.violinSlots : state.pianoSlots;
      const sorted = sortSlots(rawSlots);

      const uniqueDates = [...new Set(sorted.map(s => s.date))];
      if (state.selectedDateFilter !== 'all' && !uniqueDates.includes(state.selectedDateFilter)) {
        state.selectedDateFilter = 'all';
      }

      const filteredSlots = state.selectedDateFilter === 'all'
        ? sorted
        : sorted.filter(s => s.date === state.selectedDateFilter);

      // Regroupement par date
      const groupedByDate = {};
      filteredSlots.forEach(slot => {
        if (!groupedByDate[slot.date]) groupedByDate[slot.date] = [];
        groupedByDate[slot.date].push(slot);
      });

      // Droits d'édition du planning
      const canManageSchedule = isViolin
        ? (user.role === 'prof')
        : (user.role === 'piano' || user.role === 'prof');

      const teacherName = isViolin ? 'Félix Frochhammer' : 'Stéphanie Gurga';
      const teacherSubtitle = isViolin
        ? 'Cours de violon (45 min, 1h00, 1h30) & gestion des pauses'
        : 'Accompagnement piano — répétitions individuelles ou avec cours';

      return `
        <section class="space-y-6 animate-fade-up">
          <!-- En-tête de section -->
          <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 border-b border-line pb-5">
            <div>
              <span class="text-[11px] uppercase tracking-[0.14em] text-muted font-semibold">
                ${isViolin ? 'Classe de Violon' : 'Accompagnement Piano'}
              </span>
              <h2 class="font-serif text-2xl sm:text-3xl font-medium mt-1">${teacherName}</h2>
              <p class="text-xs sm:text-sm text-muted mt-1">${teacherSubtitle}</p>
            </div>

            ${canManageSchedule ? `
              <div class="flex items-center gap-2 shrink-0">
                ${isViolin ? `
                  <button
                    type="button"
                    onclick="openAddSlotModal('violin', 'break')"
                    class="px-3.5 py-2.5 rounded-xl border border-black text-ink text-xs sm:text-sm font-medium hover:bg-subtle transition-colors active:scale-95"
                  >
                    + Pause
                  </button>
                ` : ''}
                <button
                  type="button"
                  onclick="openAddSlotModal('${category}', 'lesson')"
                  class="px-4 py-2.5 rounded-xl bg-black text-white text-xs sm:text-sm font-medium hover:bg-neutral-800 transition-colors active:scale-95 shadow-xs"
                >
                  + Ajouter un créneau
                </button>
              </div>
            ` : `
              <div class="text-xs text-muted bg-subtle px-3 py-2 rounded-xl border border-line">
                Inscrivez-vous sur un créneau libre ou proposez un échange
              </div>
            `}
          </div>

          <!-- Filtres par date -->
          ${uniqueDates.length > 0 ? `
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
              <button
                type="button"
                onclick="setDateFilter('all')"
                class="px-3.5 py-1.5 rounded-full text-xs font-medium shrink-0 transition-colors ${
                  state.selectedDateFilter === 'all'
                    ? 'bg-black text-white'
                    : 'bg-subtle text-muted hover:text-ink border border-line'
                }"
              >
                Toutes les dates (${sorted.filter(s => s.type !== 'break').length})
              </button>
              ${uniqueDates.map(d => `
                <button
                  type="button"
                  onclick="setDateFilter('${d}')"
                  class="px-3.5 py-1.5 rounded-full text-xs font-medium shrink-0 transition-colors ${
                    state.selectedDateFilter === d
                      ? 'bg-black text-white'
                      : 'bg-subtle text-muted hover:text-ink border border-line'
                  }"
                >
                  ${formatShortDateFr(d)}
                </button>
              `).join('')}
            </div>
          ` : ''}

          <!-- Liste chronologique par journée -->
          ${Object.keys(groupedByDate).length === 0 ? `
            <div class="py-16 text-center border border-dashed border-line rounded-3xl">
              <p class="font-serif text-lg text-ink">Aucun créneau publié pour le moment</p>
              <p class="text-xs text-muted mt-1">
                ${canManageSchedule
                  ? 'Cliquez sur « + Ajouter un créneau » pour ouvrir des disponibilités.'
                  : `${teacherName} n'a pas encore publié de disponibilités.`}
              </p>
            </div>
          ` : Object.entries(groupedByDate).map(([date, daySlots]) => `
            <div class="space-y-3">
              <div class="flex items-center justify-between pt-2">
                <h3 class="text-xs font-semibold uppercase tracking-[0.1em] text-ink">
                  ${formatDateFr(date)}
                </h3>
                <span class="text-[11px] text-muted tabular-nums">
                  ${daySlots.filter(s => s.type !== 'break').length} créneau(x)
                </span>
              </div>

              <div class="space-y-2.5">
                ${daySlots.map(slot => renderSlotCard(slot, category, canManageSchedule)).join('')}
              </div>
            </div>
          `).join('')}
        </section>
      `;
    }

    function renderSlotCard(slot, category, canManageSchedule) {
      const user = getCurrentUser();
      const endTime = addMinutesToTime(slot.startTime, slot.duration);
      const durationLabel = formatDuration(slot.duration);

      // 1. Cas d'une PAUSE placée par Félix
      if (slot.type === 'break') {
        return `
          <div class="pause-pattern border border-line rounded-2xl px-4 py-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <span class="text-xs font-semibold tabular-nums text-muted shrink-0">
                ${slot.startTime} – ${endTime}
              </span>
              <span class="px-2 py-0.5 rounded-md bg-white border border-line text-[11px] font-medium tabular-nums shrink-0">
                ${durationLabel}
              </span>
              <span class="text-xs sm:text-sm font-medium text-muted truncate">
                Pause · ${escapeHtml(slot.breakLabel || 'Temps libre')}
              </span>
            </div>
            ${canManageSchedule ? `
              <button
                type="button"
                onclick="deleteSlot('${category}', '${slot.id}')"
                class="text-xs text-muted hover:text-black underline shrink-0 px-2 py-1"
              >Retirer</button>
            ` : ''}
          </div>
        `;
      }

      // 2. Cas d'un CRÉNEAU LIBRE
      if (!slot.studentId) {
        return `
          <div class="border border-dashed border-neutral-400 hover:border-black rounded-2xl p-4 bg-white transition-colors flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="space-y-1">
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-sm sm:text-base font-semibold tabular-nums">
                  ${slot.startTime} – ${endTime}
                </span>
                <span class="px-2.5 py-0.5 rounded-full border border-black text-[11px] font-medium tabular-nums">
                  ${durationLabel}
                </span>
                <span class="px-2.5 py-0.5 rounded-full bg-subtle text-muted text-[11px] font-medium">
                  Disponible
                </span>
                ${slot.room ? `<span class="text-xs text-muted">· ${escapeHtml(slot.room)}</span>` : ''}
              </div>
              <p class="text-xs text-muted">
                Créneau ouvert aux inscriptions des élèves
              </p>
            </div>

            <div class="flex items-center gap-2 shrink-0">
              ${user.role === 'student' ? `
                <button
                  type="button"
                  onclick="openBookSlotModal('${category}', '${slot.id}')"
                  class="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-black text-white text-xs sm:text-sm font-medium hover:bg-neutral-800 transition-colors active:scale-95"
                >
                  S'inscrire
                </button>
              ` : ''}
              ${canManageSchedule ? `
                <button
                  type="button"
                  onclick="openBookSlotModal('${category}', '${slot.id}', true)"
                  class="px-3 py-2 rounded-xl border border-line hover:border-black text-xs font-medium transition-colors"
                >
                  Assigner
                </button>
                ${category === 'violin' ? `
                  <button
                    type="button"
                    onclick="openInsertBreakAfterModal('${slot.id}')"
                    title="Insérer une pause juste après ce créneau"
                    class="px-3 py-2 rounded-xl border border-line hover:border-black text-xs font-medium transition-colors"
                  >
                    + Pause après
                  </button>
                ` : ''}
                <button
                  type="button"
                  onclick="deleteSlot('${category}', '${slot.id}')"
                  class="p-2 rounded-xl text-muted hover:text-black hover:bg-subtle transition-colors"
                  title="Supprimer le créneau"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }

      // 3. Cas d'un CRÉNEAU RÉSERVÉ PAR UN ÉLÈVE
      const bookedStudent = getUserById(slot.studentId);
      const isMySlot = user.id === slot.studentId;
      const hasPendingSwapFromMe = state.swaps.some(
        s => s.status === 'pending' && s.targetSlotId === slot.id && s.fromStudentId === user.id
      );

      return `
        <div class="border ${isMySlot ? 'border-black ring-1 ring-black/10' : 'border-line'} rounded-2xl p-4 bg-white shadow-2xs transition-all">
          <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
            <div class="space-y-1.5 min-w-0">
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-sm sm:text-base font-semibold tabular-nums">
                  ${slot.startTime} – ${endTime}
                </span>
                <span class="px-2.5 py-0.5 rounded-full bg-black text-white text-[11px] font-medium tabular-nums">
                  ${durationLabel}
                </span>
                <span class="text-sm font-semibold text-ink">
                  ${escapeHtml(bookedStudent ? bookedStudent.name : 'Élève')}
                </span>
                ${isMySlot ? `
                  <span class="px-2 py-0.5 rounded-md bg-subtle border border-line text-[10px] uppercase tracking-wider font-semibold">
                    Votre cours
                  </span>
                ` : ''}
              </div>

              ${slot.sessionType ? `
                <p class="text-xs font-medium text-ink">
                  Modalité : <span class="text-muted font-normal">${escapeHtml(slot.sessionType)}</span>
                  ${slot.room ? ` · <span class="text-muted font-normal">${escapeHtml(slot.room)}</span>` : ''}
                </p>
              ` : (slot.room ? `<p class="text-xs text-muted">${escapeHtml(slot.room)}</p>` : '')}

              <div class="pt-0.5">
                <p class="text-xs sm:text-sm text-ink leading-snug">
                  <span class="text-muted text-xs uppercase tracking-wider font-medium mr-1.5">Programme :</span>
                  ${slot.repertoire ? escapeHtml(slot.repertoire) : '<span class="italic text-muted">Non précisé</span>'}
                </p>
                ${slot.notes ? `
                  <p class="text-xs text-muted mt-1">Note : ${escapeHtml(slot.notes)}</p>
                ` : ''}
              </div>
            </div>

            <!-- Actions contextuelles -->
            <div class="flex flex-wrap items-center gap-2 shrink-0 pt-1 sm:pt-0">
              ${isMySlot ? `
                <button
                  type="button"
                  onclick="openBookSlotModal('${category}', '${slot.id}')"
                  class="px-3 py-2 rounded-xl border border-line hover:border-black text-xs font-medium transition-colors"
                >
                  Modifier programme
                </button>
                <button
                  type="button"
                  onclick="releaseSlot('${category}', '${slot.id}')"
                  class="px-3 py-2 rounded-xl border border-line hover:border-black text-xs text-muted hover:text-black transition-colors"
                >
                  Libérer
                </button>
              ` : ''}

              ${user.role === 'student' && !isMySlot ? (
                hasPendingSwapFromMe ? `
                  <span class="px-3 py-2 rounded-xl bg-subtle border border-line text-xs font-medium text-muted">
                    Échange demandé…
                  </span>
                ` : `
                  <button
                    type="button"
                    onclick="openProposeSwapModal('${category}', '${slot.id}')"
                    class="px-3.5 py-2 rounded-xl border border-black text-ink hover:bg-black hover:text-white text-xs font-medium transition-colors active:scale-95"
                  >
                    ⇄ Proposer un échange
                  </button>
                `
              ) : ''}

              ${canManageSchedule ? `
                ${category === 'violin' ? `
                  <button
                    type="button"
                    onclick="openInsertBreakAfterModal('${slot.id}')"
                    title="Insérer une pause juste après ce cours"
                    class="px-3 py-2 rounded-xl border border-line hover:border-black text-xs font-medium transition-colors"
                  >
                    + Pause après
                  </button>
                ` : ''}
                <button
                  type="button"
                  onclick="releaseSlot('${category}', '${slot.id}')"
                  class="px-2.5 py-2 rounded-xl text-xs text-muted hover:text-black hover:bg-subtle transition-colors"
                  title="Libérer ce créneau"
                >
                  Libérer
                </button>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function setDateFilter(dateVal) {
      state.selectedDateFilter = dateVal;
      renderApp();
    }

    // =========================================================================
    // 7. VUE AUDITIONS DE CLASSE
    // =========================================================================
    function renderAuditionsView() {
      const user = getCurrentUser();
      const canCreateAudition = user.role === 'prof' || user.role === 'piano';

      return `
        <section class="space-y-6 animate-fade-up">
          <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 border-b border-line pb-5">
            <div>
              <span class="text-[11px] uppercase tracking-[0.14em] text-muted font-semibold">
                Concerts &amp; Filages internes
              </span>
              <h2 class="font-serif text-2xl sm:text-3xl font-medium mt-1">Auditions de classe</h2>
              <p class="text-xs sm:text-sm text-muted mt-1">
                Programme complet, ordre de passage et durées estimées
              </p>
            </div>

            ${canCreateAudition ? `
              <button
                type="button"
                onclick="openCreateAuditionModal()"
                class="px-4 py-2.5 rounded-xl bg-black text-white text-xs sm:text-sm font-medium hover:bg-neutral-800 transition-colors active:scale-95 shrink-0"
              >
                + Nouvelle audition
              </button>
            ` : ''}
          </div>

          ${state.auditions.length === 0 ? `
            <div class="py-16 text-center border border-dashed border-line rounded-3xl">
              <p class="font-serif text-lg">Aucune audition programmée</p>
              <p class="text-xs text-muted mt-1">Félix Frochhammer publiera prochainement les dates d'audition.</p>
            </div>
          ` : state.auditions.map(aud => {
            const totalMinutes = aud.performers.reduce((sum, p) => sum + Number(p.durationMinutes || 0), 0);
            const myEntry = aud.performers.find(p => p.studentId === user.id);

            return `
              <article class="border border-line rounded-3xl overflow-hidden bg-white shadow-2xs">
                <!-- En-tête de l'audition -->
                <div class="p-5 sm:p-6 bg-subtle/60 border-b border-line flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div class="space-y-1">
                    <div class="flex flex-wrap items-center gap-2 text-xs font-medium text-muted">
                      <span class="text-ink font-semibold">${formatDateFr(aud.date)}</span>
                      <span>·</span>
                      <span class="tabular-nums">${aud.time}</span>
                      <span>·</span>
                      <span>${escapeHtml(aud.location)}</span>
                    </div>
                    <h3 class="font-serif text-xl sm:text-2xl font-medium text-ink">
                      ${escapeHtml(aud.title)}
                    </h3>
                    ${aud.description ? `<p class="text-xs sm:text-sm text-muted pt-1">${escapeHtml(aud.description)}</p>` : ''}
                  </div>

                  <div class="flex sm:flex-col items-center sm:items-end justify-between gap-2 shrink-0">
                    <span class="px-3 py-1 rounded-full bg-black text-white text-xs font-medium tabular-nums">
                      Durée totale : ${formatDuration(totalMinutes)}
                    </span>
                    <span class="text-xs text-muted tabular-nums">
                      ${aud.performers.length} participant(s)
                    </span>
                  </div>
                </div>

                <!-- Liste des participants et programmes -->
                <div class="divide-y divide-line">
                  ${aud.performers.length === 0 ? `
                    <div class="p-8 text-center text-xs text-muted">
                      Aucun élève inscrit pour le moment. Soyez le premier à inscrire votre programme !
                    </div>
                  ` : aud.performers.map((perf, idx) => {
                    const performerUser = getUserById(perf.studentId);
                    const isMe = perf.studentId === user.id;
                    return `
                      <div class="p-4 sm:px-6 flex items-start justify-between gap-4 ${isMe ? 'bg-subtle/40' : ''}">
                        <div class="flex items-start gap-3.5 min-w-0">
                          <span class="w-6 h-6 rounded-full border border-black text-xs font-semibold flex items-center justify-center shrink-0 mt-0.5 tabular-nums">
                            ${idx + 1}
                          </span>
                          <div class="min-w-0 space-y-1">
                            <div class="flex flex-wrap items-center gap-2">
                              <span class="font-semibold text-sm">${escapeHtml(performerUser ? performerUser.name : 'Élève')}</span>
                              <span class="px-2 py-0.5 rounded-md bg-subtle border border-line text-[11px] font-medium tabular-nums">
                                ${perf.durationMinutes} min
                              </span>
                              ${perf.withPiano ? `
                                <span class="px-2 py-0.5 rounded-md bg-black text-white text-[10px] font-medium">
                                  Piano : Stéphanie Gurga
                                </span>
                              ` : `
                                <span class="px-2 py-0.5 rounded-md border border-line text-[10px] text-muted">
                                  Violon seul
                                </span>
                              `}
                            </div>
                            <p class="text-xs sm:text-sm text-ink">
                              ${escapeHtml(perf.piece)}
                            </p>
                          </div>
                        </div>

                        ${(isMe || canCreateAudition) ? `
                          <button
                            type="button"
                            onclick="removeAuditionPerformer('${aud.id}', '${perf.id}')"

                            Retirer
                          </button>

                </div>

                <!-- Pied de carte : Inscription élève -->
                <div class="px-5 py-4 bg-white border-t border-line flex items-center justify-between gap-3">
                  <span class="text-xs text-muted">
                    ${myEntry ? 'Vous êtes inscrit(e) à cette audition.' : 'Indiquez votre œuvre et la durée estimée.'}
                  </span>
                  ${user.role === 'student' && !myEntry ? `
                    <button
                      type="button"
                      onclick="openJoinAuditionModal('${aud.id}')"
                      class="px-4 py-2 rounded-xl bg-black text-white text-xs sm:text-sm font-medium hover:bg-neutral-800 transition-colors active:scale-95"
                    >
                      + S'inscrire à l'audition
                    </button>

                  ${canCreateAudition ? `
                    <button
                      type="button"
                      onclick="openJoinAuditionModal('${aud.id}', true)"

                </div>
              </article>

          }).join('')}
        </section>
      `;
    }

    // =========================================================================
    // 8. VUE ÉCHANGES D'HORAIRES & COORDINATION ENTRE ÉLÈVES
    // =========================================================================
    function renderSwapsView() {
      const user = getCurrentUser();
      const pendingSwaps = state.swaps.filter(s => s.status === 'pending');
      const historySwaps = state.swaps.filter(s => s.status !== 'pending');

      return `
        <section class="space-y-6 animate-fade-up">
          <div class="border-b border-line pb-5">
            <span class="text-[11px] uppercase tracking-[0.14em] text-muted font-semibold">
              Entraide &amp; Flexibilité
            </span>
            <h2 class="font-serif text-2xl sm:text-3xl font-medium mt-1">Échanges d'horaires</h2>
            <p class="text-xs sm:text-sm text-muted mt-1">
              Proposez et validez des permutations de créneaux en violon ou au piano.
            </p>
          </div>

          <!-- Propositions en cours -->
          <div class="space-y-3">
            <h3 class="text-xs font-semibold uppercase tracking-[0.1em] text-ink">
              Propositions en attente (${pendingSwaps.length})
            </h3>

            ${pendingSwaps.length === 0 ? `
              <div class="p-8 text-center border border-dashed border-line rounded-2xl">
                <p class="text-sm font-medium">Aucune proposition d'échange en attente</p>
                <p class="text-xs text-muted mt-1">
                  Pour demander un échange, rendez-vous sur l'onglet <strong>Violon</strong> ou <strong>Piano</strong> et cliquez sur « ⇄ Proposer un échange » sur le créneau d'un camarade.
                </p>
              </div>
            ` : pendingSwaps.map(swap => renderSwapCard(swap, user)).join('')}
          </div>

          <!-- Historique des échanges -->
          ${historySwaps.length > 0 ? `
            <div class="space-y-3 pt-4">
              <h3 class="text-xs font-semibold uppercase tracking-[0.1em] text-muted">
                Historique récent (${historySwaps.length})
              </h3>
              ${historySwaps.map(swap => renderSwapCard(swap, user)).join('')}
            </div>
          ` : ''}
        </section>
      `;
    }

    function renderSwapCard(swap, user) {
      const fromUser = getUserById(swap.fromStudentId);
      const toUser = getUserById(swap.toStudentId);
      const list = swap.category === 'violin' ? state.violinSlots : state.pianoSlots;
      const targetSlot = list.find(s => s.id === swap.targetSlotId);
      const offeredSlot = list.find(s => s.id === swap.offeredSlotId);
      const isRecipient = user.id === swap.toStudentId && swap.status === 'pending';

      const statusBadge = swap.status === 'pending'
        ? '<span class="px-2.5 py-0.5 rounded-full bg-black text-white text-[11px] font-medium">En attente</span>'
        : swap.status === 'accepted'
          ? '<span class="px-2.5 py-0.5 rounded-full border border-black text-ink text-[11px] font-semibold">✓ Accepté &amp; Permuté</span>'
          : '<span class="px-2.5 py-0.5 rounded-full bg-subtle text-muted text-[11px]">Refusé</span>';

      return `
        <div class="border ${isRecipient ? 'border-black' : 'border-line'} rounded-2xl p-4 sm:p-5 bg-white space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-semibold uppercase tracking-wider text-muted">
                ${swap.category === 'violin' ? 'Violon (F. Frochhammer)' : 'Piano (S. Gurga)'}
              </span>
              <span class="text-xs text-muted">· ${swap.createdAt}</span>
            </div>
            ${statusBadge}
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-subtle p-3.5 rounded-xl border border-line/80 text-xs">
            <div>
              <span class="text-[10px] uppercase tracking-wider text-muted block">Créneau proposé par ${escapeHtml(fromUser?.name || '')}</span>
              <strong class="text-sm font-semibold block mt-0.5 tabular-nums">
                ${offeredSlot ? `${formatShortDateFr(offeredSlot.date)} · ${offeredSlot.startTime} (${formatDuration(offeredSlot.duration)})` : 'Créneau libéré'}
              </strong>
            </div>
            <div>
              <span class="text-[10px] uppercase tracking-wider text-muted block">Contre le créneau de ${escapeHtml(toUser?.name || '')}</span>
              <strong class="text-sm font-semibold block mt-0.5 tabular-nums">

    // A. Ajouter un créneau de cours OU une pause (Félix / Stéphanie)

        defaultType === 'break' ? 'Ajouter une pause (Félix)' : (isViolin ? 'Nouveau créneau — Violon' : 'Nouveau créneau — Piano'),

              </div>
              <div>
                <label class="block text-xs font-medium text-muted mb-1">Heure de début</label>
                <input type="time" id="slot-time-input" value="${suggestedTime}" required class="w-full px-3.5 py-2.5 rounded-xl border border-line focus:border-black focus:outline-none text-sm tabular-nums" />

      document.getElementById('form-add-slot').addEventListener('submit', async (e) => {

    function switchSlotModalType(type) {
      document.getElementById('slot-type-input').value = type;
      const lessonBtn = document.getElementById('type-lesson-btn');
      const breakBtn = document.getElementById('type-break-btn');
      const breakGroup = document.getElementById('break-label-group');
      const durInput = document.getElementById('slot-duration-input');

      if (type === 'break') {
        breakBtn.classList.add('bg-black', 'text-white');
        breakBtn.classList.remove('text-muted');
        lessonBtn.classList.remove('bg-black', 'text-white');
        lessonBtn.classList.add('text-muted');
        breakGroup.classList.remove('hidden');
        durInput.value = 20;
      } else {
        lessonBtn.classList.add('bg-black', 'text-white');
        lessonBtn.classList.remove('text-muted');
        breakBtn.classList.remove('bg-black', 'text-white');
        breakBtn.classList.add('text-muted');
        breakGroup.classList.add('hidden');

      const targetSlot = state.violinSlots.find(s => s.id === afterSlotId);

      const breakStart = addMinutesToTime(targetSlot.startTime, targetSlot.duration);

      openModal('Insérer une pause après ce cours', `

          <div class="p-3.5 rounded-xl bg-subtle border border-line text-xs space-y-1">

                <button type="button" onclick="document.getElementById('ins-break-dur').value=${m}" class="py-2 rounded-xl border border-line hover:border-black text-xs font-medium tabular-nums">

          </div>

            <label class="block text-xs font-medium text-muted mb-1">Intitulé (optionnel)</label>

          <label class="flex items-start gap-2.5 p-3 rounded-xl border border-line cursor-pointer">
            <input type="checkbox" id="ins-break-shift" checked class="mt-0.5 accent-black" />
            <span class="text-xs text-ink leading-relaxed">
              Décaler automatiquement les créneaux suivants de cette journée de la durée de la pause
            </span>
          </label>

          <button type="submit" class="w-full py-3 rounded-xl bg-black text-white text-sm font-semibold hover:bg-neutral-800 transition-colors">
            Insérer la pause
          </button>
        </form>
      `);

      document.getElementById('form-insert-break').addEventListener('submit', async (e) => {
        e.preventDefault();
        const dur = Math.max(5, parseInt(document.getElementById('ins-break-dur').value, 10) || 15);
        const label = document.getElementById('ins-break-label').value.trim() || 'Pause';
        const shouldShift = document.getElementById('ins-break-shift').checked;
        const breakStartMins = timeToMinutes(breakStart);

        const cloudUpdates = [];
        if (shouldShift) {
          state.violinSlots.forEach(s => {
            if (s.date === targetSlot.date && timeToMinutes(s.startTime) >= breakStartMins) {
              s.startTime = addMinutesToTime(s.startTime, dur);
              cloudUpdates.push(saveDocToCloud('violinSlots', s.id, s));
            }
          });
        }

        const newBreak = {
          id: uid('v'),
          date: targetSlot.date,
          startTime: breakStart,
          duration: dur,
          type: 'break',
          breakLabel: label,
          studentId: null,
          repertoire: '',
          notes: ''
        };
        state.violinSlots.push(newBreak);
        cloudUpdates.push(saveDocToCloud('violinSlots', newBreak.id, newBreak));
        await Promise.all(cloudUpdates);

        closeModal();
        showToast(`Pause de ${dur} min insérée.`);
        renderApp();

      slot.repertoire = '';

    async function deleteSlot(category, slotId) {
      const colName = category === 'violin' ? 'violinSlots' : 'pianoSlots';
      if (category === 'violin') {
        state.violinSlots = state.violinSlots.filter(s => s.id !== slotId);

        state.pianoSlots = state.pianoSlots.filter(s => s.id !== slotId);

    // D. Proposer un échange d'horaire à un autre élève
    function openProposeSwapModal(category, targetSlotId) {
      const user = getCurrentUser();
      const list = category === 'violin' ? state.violinSlots : state.pianoSlots;
      const targetSlot = list.find(s => s.id === targetSlotId);
      if (!targetSlot) return;

      const targetStudent = getUserById(targetSlot.studentId);
      const mySlots = list.filter(s => s.studentId === user.id && s.type !== 'break');

      if (mySlots.length === 0) {
        openModal('Échange impossible', `
          <div class="space-y-4">
            <p class="text-sm text-ink leading-relaxed">
              Vous n'avez actuellement aucun créneau réservé en <strong>${category === 'violin' ? 'violon' : 'piano'}</strong> à proposer en échange à <strong>${escapeHtml(targetStudent?.name || 'cet élève')}</strong>.
            </p>
            <p class="text-xs text-muted">
              Inscrivez-vous d'abord sur un créneau disponible, puis vous pourrez proposer une permutation.
            </p>
            <button type="button" onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-black text-white text-sm font-medium">
              Compris
            </button>
          </div>
        `);
        return;
      }

      openModal('Proposer un échange d’horaire', `
        <form id="form-propose-swap" class="space-y-4">
          <div class="p-3.5 rounded-xl bg-subtle border border-line text-xs space-y-1">
            <span class="text-muted">Créneau souhaité (détenu par ${escapeHtml(targetStudent?.name || '')}) :</span>
            <p class="font-semibold text-sm tabular-nums">
              ${formatDateFr(targetSlot.date)} · ${targetSlot.startTime} – ${addMinutesToTime(targetSlot.startTime, targetSlot.duration)} (${formatDuration(targetSlot.duration)})
            </p>
          </div>

          <div>
            <label class="block text-xs font-medium text-muted mb-1">Votre créneau proposé en échange</label>
            <select id="swap-offered-slot" class="w-full px-3.5 py-2.5 rounded-xl border border-line focus:border-black focus:outline-none text-sm bg-white">
              ${mySlots.map(ms => `
                <option value="${ms.id}">
                  ${formatShortDateFr(ms.date)} · ${ms.startTime} – ${addMinutesToTime(ms.startTime, ms.duration)} (${formatDuration(ms.duration)})
                </option>
              `).join('')}
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-muted mb-1">Message pour ${escapeHtml(targetStudent?.name || 'votre camarade')}</label>
            <textarea
              id="swap-message"
              rows="3"
              placeholder="Ex : Bonjour, aurais-tu la possibilité d'échanger nos horaires ce jour-là ?"
              class="w-full px-3.5 py-2.5 rounded-xl border border-line focus:border-black focus:outline-none text-sm"
            ></textarea>
          </div>

          <button type="submit" class="w-full py-3 rounded-xl bg-black text-white text-sm font-semibold hover:bg-neutral-800 transition-colors">
            Envoyer la proposition d'échange
          </button>
        </form>
      `);

      document.getElementById('form-propose-swap').addEventListener('submit', async (e) => {
        e.preventDefault();
        const offeredSlotId = document.getElementById('swap-offered-slot').value;
        const message = document.getElementById('swap-message').value.trim();

        const newSwap = {
          id: uid('swap'),
          category,
          fromStudentId: user.id,
          toStudentId: targetSlot.studentId,
          targetSlotId: targetSlot.id,
          offeredSlotId,
          message,
          status: 'pending',
          createdAt: 'À l’instant',
          createdAtMs: Date.now()
        };
        state.swaps.unshift(newSwap);
        await saveDocToCloud('swaps', newSwap.id, newSwap);

        addNotification(
          targetSlot.studentId,
          'Nouvelle proposition d’échange',
          `${user.name} vous propose d'échanger votre créneau du ${formatShortDateFr(targetSlot.date)} à ${targetSlot.startTime}.`

        closeModal();
        showToast(`Proposition envoyée à ${targetStudent?.name || 'l’élève'}.`);
        renderApp();
      });
    }

    // E. Répondre à une proposition d'échange (Accepter = permutation réelle des créneaux !)
    async function respondToSwap(swapId, accept) {
      const swap = state.swaps.find(s => s.id === swapId);
      if (!swap || swap.status !== 'pending') return;

      const fromUser = getUserById(swap.fromStudentId);
      const toUser = getUserById(swap.toStudentId);
      const colName = swap.category === 'violin' ? 'violinSlots' : 'pianoSlots';

      if (accept) {
        const list = swap.category === 'violin' ? state.violinSlots : state.pianoSlots;
        const slotA = list.find(s => s.id === swap.offeredSlotId);
        const slotB = list.find(s => s.id === swap.targetSlotId);

        if (slotA && slotB) {
          // Permutation des élèves tout en conservant le programme de chacun sur son nouveau créneau
          const tempStudent = slotA.studentId;
          const tempRep = slotA.repertoire;
          const tempNotes = slotA.notes;
          const tempSession = slotA.sessionType;

          slotA.studentId = slotB.studentId;
          slotA.repertoire = slotB.repertoire;
          slotA.notes = slotB.notes;
          slotA.sessionType = slotB.sessionType;

          slotB.studentId = tempStudent;
          slotB.repertoire = tempRep;
          slotB.notes = tempNotes;
          slotB.sessionType = tempSession;

          await Promise.all([
            saveDocToCloud(colName, slotA.id, slotA),
            saveDocToCloud(colName, slotB.id, slotB)
          ]);
        }

        swap.status = 'accepted';
        await saveDocToCloud('swaps', swap.id, swap);
        addNotification(
          swap.fromStudentId,
          'Échange d’horaire accepté ✓',
          `${toUser?.name || 'Votre camarade'} a accepté l'échange. Le planning a été mis à jour automatiquement.`
        );
        addNotification(
          swap.category === 'violin' ? 'felix' : 'stephanie',
          'Échange effectué entre élèves',
          `${fromUser?.name || ''} et ${toUser?.name || ''} ont permuté leurs créneaux.`
        );
        showToast('Échange accepté ! Le planning est à jour.');
      } else {
        swap.status = 'declined';
        await saveDocToCloud('swaps', swap.id, swap);
        addNotification(
          swap.fromStudentId,
          'Échange d’horaire refusé',
          `${toUser?.name || 'Votre camarade'} n'a pas pu accepter votre demande d'échange.`
        );
        showToast('Proposition d’échange refusée.');
      }

      renderApp();
    }

            <input type="text" id="aud-title" required placeholder="Ex : Audition de classe — Printemps" class="w-full px-3.5 py-2.5 rounded-xl border border-line focus:border-black focus:outline-none text-sm" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-muted mb-1">Date</label>
              <input type="date" id="aud-date" value="2026-12-11" required class="w-full px-3.5 py-2.5 rounded-xl border border-line focus:border-black focus:outline-none text-sm tabular-nums" />
            </div>
            <div>
              <label class="block text-xs font-medium text-muted mb-1">Heure</label>
              <input type="time" id="aud-time" value="18:00" required class="w-full px-3.5 py-2.5 rounded-xl border border-line focus:border-black focus:outline-none text-sm tabular-nums" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-muted mb-1">Lieu / Salle</label>
            <input type="text" id="aud-location" value="Auditorium" required class="w-full px-3.5 py-2.5 rounded-xl border border-line focus:border-black focus:outline-none text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-muted mb-1">Informations complémentaires</label>
            <textarea id="aud-desc" rows="2" placeholder="Ex : Présence de Stéphanie Gurga, filage général..." class="w-full px-3.5 py-2.5 rounded-xl border border-line focus:border-black focus:outline-none text-sm"></textarea>
          </div>
          <button type="submit" class="w-full py-3 rounded-xl bg-black text-white text-sm font-semibold hover:bg-neutral-800 transition-colors">
            Publier l'audition
          </button>
        </form>
      `);

      document.getElementById('form-new-audition').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('aud-title').value.trim();
        const date = document.getElementById('aud-date').value;
        const time = document.getElementById('aud-time').value;
        const location = document.getElementById('aud-location').value.trim();
        const description = document.getElementById('aud-desc').value.trim();

        const newAud = {
          id: uid('aud'),
          title,
          date,
          time,
          location,
          description,
          performers: []
        };
        state.auditions.unshift(newAud);
        await saveDocToCloud('auditions', newAud.id, newAud);

        addNotification('all', 'Nouvelle audition publiée', `${title} — ${formatShortDateFr(date)} à ${time} (${location}).`);
        closeModal();
        showToast('Audition publiée.');
        renderApp();
      });
    }

    function openJoinAuditionModal(auditionId, isAdminAdd = false) {
      const aud = state.auditions.find(a => a.id === auditionId);
      if (!aud) return;
      const user = getCurrentUser();
      const students = state.users.filter(u => u.role === 'student');

      openModal('Inscription à l’audition', `
        <form id="form-join-audition" class="space-y-4">
          <div class="p-3.5 rounded-xl bg-subtle border border-line text-xs">
            <p class="font-semibold text-sm">${escapeHtml(aud.title)}</p>
            <p class="text-muted mt-0.5">${formatDateFr(aud.date)} à ${aud.time} · ${escapeHtml(aud.location)}</p>
          </div>

          ${isAdminAdd ? `
            <div>
              <label class="block text-xs font-medium text-muted mb-1">Élève</label>
              <select id="perf-student" class="w-full px-3.5 py-2.5 rounded-xl border border-line focus:border-black focus:outline-none text-sm bg-white">
                ${students.map(st => `<option value="${st.id}">${escapeHtml(st.name)}</option>`).join('')}
              </select>
            </div>
          ` : ''}

          <div>
            <label class="block text-xs font-medium text-muted mb-1">Programme joué (Compositeur, Œuvre, Mouvements)</label>
            <textarea id="perf-piece" rows="3" required placeholder="Ex : E. Ysaÿe — Sonate pour violon seul n°3 en ré mineur « Ballade »" class="w-full px-3.5 py-2.5 rounded-xl border border-line focus:border-black focus:outline-none text-sm"></textarea>
          </div>

          <div>
            <label class="block text-xs font-medium text-muted mb-1">Durée estimée (minutes)</label>
            <input type="number" id="perf-dur" value="12" min="2" max="60" required class="w-full px-3.5 py-2.5 rounded-xl border border-line focus:border-black focus:outline-none text-sm tabular-nums" />
          </div>

          <label class="flex items-center gap-2.5 p-3 rounded-xl border border-line cursor-pointer">
            <input type="checkbox" id="perf-piano" checked class="accent-black" />
            <span class="text-xs font-medium">Accompagné(e) au piano par Stéphanie Gurga</span>
          </label>

          <button type="submit" class="w-full py-3 rounded-xl bg-black text-white text-sm font-semibold hover:bg-neutral-800 transition-colors">
            Valider mon inscription
          </button>
        </form>
      `);

      document.getElementById('form-join-audition').addEventListener('submit', async (e) => {
        e.preventDefault();
        const studentId = isAdminAdd ? document.getElementById('perf-student').value : user.id;
        const piece = document.getElementById('perf-piece').value.trim();
        const durationMinutes = Math.max(1, parseInt(document.getElementById('perf-dur').value, 10) || 10);
        const withPiano = document.getElementById('perf-piano').checked;

        aud.performers.push({
          id: uid('perf'),
          studentId,
          piece,
          durationMinutes,
          withPiano
        });
        await saveDocToCloud('auditions', aud.id, aud);

        closeModal();
        showToast('Programme ajouté à l’audition.');
        renderApp();
      });
    }

    async function removeAuditionPerformer(auditionId, perfId) {
      const aud = state.auditions.find(a => a.id === auditionId);
      if (!aud) return;
      aud.performers = aud.performers.filter(p => p.id !== perfId);
      await saveDocToCloud('auditions', aud.id, aud);
      showToast('Participant retiré.');
      renderApp();
    }

    // =========================================================================
    // 10. SÉLECTEUR DE PROFIL, NOTIFICATIONS & GUIDE PWA / GITHUB PAGES
    // =========================================================================

    // Sélecteur de profil (Professeur, Accompagnatrice, Élèves)
    document.getElementById('btn-open-profile').addEventListener('click', () => {
      const sessionBadge = authUser ? authUser.uid : 'Session locale';
      openModal('Changer d’utilisateur', `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-subtle border border-line text-[11px] text-muted">
            <span>Statut : <strong class="text-ink">${isCloudConnected ? 'Synchronisé en temps réel' : 'Mode local'}</strong></span>
            <span class="font-mono truncate max-w-[140px]" title="${escapeHtml(sessionBadge)}">ID: ${escapeHtml(sessionBadge)}</span>
          </div>

          <p class="text-xs text-muted leading-relaxed">
            Sélectionnez votre profil pour accéder à vos fonctionnalités dédiées (gestion des créneaux et pauses pour Félix/Stéphanie, inscriptions et échanges pour les élèves).
          </p>

          <div class="space-y-2">
            ${state.users.map(u => {
              const active = u.id === state.currentUserId;
              const badge = u.role === 'prof' ? 'Professeur' : (u.role === 'piano' ? 'Piano' : 'Élève');
              return `
                <button
                  type="button"
                  onclick="selectUser('${u.id}')"
                  class="w-full p-3.5 rounded-2xl border ${active ? 'border-black bg-black text-white' : 'border-line hover:border-black bg-white text-ink'} flex items-center justify-between text-left transition-colors"
                >
                  <div>
                    <div class="font-semibold text-sm">${escapeHtml(u.name)}</div>
                    <div class="text-xs ${active ? 'text-neutral-300' : 'text-muted'}">${escapeHtml(u.subtitle)}</div>
                  </div>
                  <span class="px-2.5 py-1 rounded-full text-[11px] font-medium ${active ? 'bg-white text-black' : 'bg-subtle text-ink'}">
                    ${badge}
                  </span>
                </button>
              `;
            }).join('')}
          </div>

          <form id="form-new-student" class="pt-3 border-t border-line space-y-2.5">
            <label class="block text-xs font-medium text-muted">Ajouter un nouvel élève à la classe</label>
            <div class="flex gap-2">
              <input
                type="text"
                id="new-student-name"
                placeholder="Prénom et Nom"
                required
                class="flex-1 px-3.5 py-2.5 rounded-xl border border-line focus:border-black focus:outline-none text-sm"
              />
              <button type="submit" class="px-4 py-2.5 rounded-xl bg-black text-white text-xs font-semibold hover:bg-neutral-800 transition-colors">
                Ajouter
              </button>
            </div>
          </form>
        </div>
      `);

      document.getElementById('form-new-student').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('new-student-name').value.trim();
        if (!name) return;
        const newUser = {
          id: uid('student'),
          name,
          role: 'student',
          subtitle: 'Classe de violon'
        };
        state.users.push(newUser);
        state.currentUserId = newUser.id;
        await saveDocToCloud('users', newUser.id, newUser);
        closeModal();
        showToast(`Profil « ${name} » créé et activé.`);
        renderApp();
      });
    });

    function selectUser(userId) {
      state.currentUserId = userId;
      closeModal();
      const u = getCurrentUser();
      showToast(`Connecté en tant que ${u.name}`);
      renderApp();
    }

    // Centre de notifications
    document.getElementById('btn-open-notifs').addEventListener('click', async () => {
      const user = getCurrentUser();
      const myNotifs = state.notifications.filter(
        n => n.targetUserId === user.id || n.targetUserId === 'all'
      );
      const updates = [];
      myNotifs.forEach(n => {
        if (!n.read) {
          n.read = true;
          updates.push(saveDocToCloud('notifications', n.id, n));
        }
      });
      if (updates.length > 0) {
        Promise.all(updates);
      }
      renderApp();

      openModal('Alertes & Notifications', `
        <div class="space-y-3">
          ${myNotifs.length === 0 ? `
            <p class="py-8 text-center text-xs text-muted">Aucune notification pour ${escapeHtml(user.name)}.</p>
          ` : myNotifs.map(n => `
            <div class="p-3.5 rounded-2xl border border-line bg-subtle/40 space-y-1">
              <div class="flex items-center justify-between gap-2">
                <strong class="text-xs font-semibold">${escapeHtml(n.title)}</strong>
                <span class="text-[11px] text-muted">${escapeHtml(n.time)}</span>
              </div>
              <p class="text-xs text-ink leading-relaxed">${escapeHtml(n.body)}</p>
            </div>
          `).join('')}
        </div>
      `);
    });

    // Guide Installation Écran d'accueil (PWA) & Export des 3 fichiers GitHub Pages
    document.getElementById('btn-open-pwa').addEventListener('click', () => {
      const hasCustomFirebase = Boolean(GITHUB_FIREBASE_CONFIG.apiKey && GITHUB_FIREBASE_CONFIG.projectId);

      openModal('PWA & Déploiement GitHub Pages', `
        <div class="space-y-4 text-xs sm:text-sm">
          <!-- Étape 1 : Les 3 fichiers du dépôt GitHub -->
          <div class="p-4 rounded-2xl border border-black bg-white space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="font-semibold text-sm">1. Télécharger les 3 fichiers PWA</h3>
              <span class="px-2 py-0.5 rounded-full bg-subtle border border-line text-[10px] font-medium">Racine du dépôt</span>
            </div>
            <p class="text-xs text-muted leading-relaxed">
              Déposez ces <strong>3 fichiers</strong> à la racine de votre dépôt GitHub (branche <code class="px-1 py-0.5 bg-subtle rounded font-mono">main</code>) pour que l'application soit installable sur iPhone et Android :
            </p>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-1">
              <button
                type="button"
                onclick="downloadGithubIndexHtml()"
                class="py-2.5 px-3 rounded-xl bg-black text-white text-xs font-semibold hover:bg-neutral-800 transition-colors"
              >
                ↓ index.html
              </button>
              <button
                type="button"
                onclick="downloadGithubManifestJson()"
                class="py-2.5 px-3 rounded-xl border border-black text-ink text-xs font-semibold hover:bg-subtle transition-colors"
              >
                ↓ manifest.json
              </button>
              <button
                type="button"
                onclick="downloadGithubSwJs()"
                class="py-2.5 px-3 rounded-xl border border-black text-ink text-xs font-semibold hover:bg-subtle transition-colors"
              >
                ↓ sw.js
              </button>
            </div>
          </div>

          <!-- Étape 2 : Connexion Base de données Firebase -->
          <div class="p-4 rounded-2xl bg-subtle border border-line space-y-2">
            <div class="flex items-center justify-between gap-2">
              <h3 class="font-semibold text-sm">2. Base de données partagée (Firebase)</h3>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${hasCustomFirebase ? 'bg-black text-white' : 'bg-white border border-line text-muted'}">
                ${hasCustomFirebase ? 'Clés configurées' : 'À configurer'}
              </span>
            </div>
            <p class="text-xs text-muted leading-relaxed">
              Ouvrez <code class="px-1 py-0.5 bg-white rounded font-mono">index.html</code> dans un éditeur de texte et renseignez vos identifiants gratuits <strong>Firebase</strong> dans <code class="px-1 py-0.5 bg-white rounded font-mono">GITHUB_FIREBASE_CONFIG</code> (lignes 144–151) afin que Félix, Stéphanie et les élèves partagent le même planning en direct.
            </p>
          </div>

          <!-- Étape 3 : Installation mobile -->
          <div class="p-4 rounded-2xl bg-subtle border border-line space-y-2">
            <h3 class="font-semibold text-sm">3. Ajouter sur l'écran d'accueil</h3>
            <ul class="text-xs space-y-1.5 text-ink">
              <li><strong>iPhone / iPad (Safari) :</strong> Appuyez sur <em>Partager</em> puis <em>« Sur l'écran d'accueil »</em>.</li>
              <li><strong>Android (Chrome) :</strong> Appuyez sur <em>⋮</em> puis <em>« Installer l'application »</em>.</li>
            </ul>
            ${deferredInstallPrompt ? `
              <button type="button" id="btn-trigger-native-install" class="mt-2 w-full py-2.5 rounded-xl bg-black text-white text-xs font-semibold">
                Installer maintenant sur cet appareil
              </button>
            ` : ''}
          </div>
        </div>
      `);

      const nativeBtn = document.getElementById('btn-trigger-native-install');
      if (nativeBtn && deferredInstallPrompt) {
        nativeBtn.addEventListener('click', async () => {
          deferredInstallPrompt.prompt();
          await deferredInstallPrompt.userChoice;
          deferredInstallPrompt = null;
          closeModal();
        });
      }
    });

    function triggerFileDownload(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(`Fichier ${filename} téléchargé.`);
    }

    function downloadGithubIndexHtml() {
      // Clone propre du document sans les éléments injectés dynamiquement à l'exécution
      const clone = document.documentElement.cloneNode(true);
      const manifestEl = clone.querySelector('#pwa-manifest');
      if (manifestEl) manifestEl.setAttribute('href', './manifest.json');
      const appleEl = clone.querySelector('#apple-touch-icon');
      if (appleEl) appleEl.removeAttribute('href');
      ['#app-content', '#modal-body', '#toast-container', '#pending-swap-banner'].forEach(sel => {
        const el = clone.querySelector(sel);
        if (el) el.innerHTML = '';
      });
      const modalBackdrop = clone.querySelector('#modal-backdrop');
      if (modalBackdrop) modalBackdrop.classList.add('hidden');
      const banner = clone.querySelector('#pending-swap-banner');
      if (banner) banner.classList.add('hidden');

      const htmlContent = '<!DOCTYPE html>\n' + clone.outerHTML;
      triggerFileDownload('index.html', htmlContent, 'text/html;charset=utf-8');
    }

    function downloadGithubManifestJson() {
      const jsonContent = JSON.stringify(getManifestObject(), null, 2);
      triggerFileDownload('manifest.json', jsonContent, 'application/manifest+json;charset=utf-8');
    }

    function downloadGithubSwJs() {
      triggerFileDownload('sw.js', getServiceWorkerSource(), 'application/javascript;charset=utf-8');
    }

    // =========================================================================
    // 11. EXPOSITION GLOBALE DES ACTIONS & DÉMARRAGE INITIAL
    // =========================================================================
    Object.assign(window, {
      respondToSwap,
      openAddSlotModal,
      setDateFilter,
      deleteSlot,
      openBookSlotModal,
      openInsertBreakAfterModal,
      releaseSlot,
      openProposeSwapModal,
      openCreateAuditionModal,
      removeAuditionPerformer,
      openJoinAuditionModal,
      switchSlotModalType,
      closeModal,
      selectUser,
      downloadGithubIndexHtml,
      downloadGithubManifestJson,
      downloadGithubSwJs
    });

    renderApp();
    initRealtimeSync();
  </script>
